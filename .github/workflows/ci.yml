# Test del BE a ogni push e pull request.
#
# Gli stessi comandi che si lanciano in locale (vedi CLAUDE.md): pytest su
# SQLite in memoria, quindi niente Postgres da avviare. Python 3.12 come
# l'immagine del Dockerfile.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # `database.py` compone l'URL di Postgres dalle variabili d'ambiente già
    # all'import (in locale le prende dal .env, che in CI non c'è): senza, la
    # porta diventa "None" e l'import fallisce. Valori fittizi bastano — i test
    # usano SQLite in memoria e creare l'engine non apre connessioni.
    env:
      DB_USER: ci
      DB_PASSWORD: ci
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: ci
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Dipendenze
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Migration con una sola head
        # Due migration che rivedono la stessa revisione rompono `upgrade head`
        # in produzione: meglio scoprirlo qui.
        run: test "$(python -m alembic heads | wc -l)" -eq 1

      - name: Test
        # Lo scheduler non serve nei test e non deve partire sul runner.
        env:
          RUN_SCHEDULER: "false"
        run: python -m pytest -q
